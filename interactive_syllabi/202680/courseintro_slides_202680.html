<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSCI-1100/1150 — Course Introduction</title>
<style>
  :root{
    --paper:#F5F6F4;
    --ink:#15181D;
    --ink-soft:#5B6270;
    --line:#DBDEE2;
    --overview:#2B5FA6;
    --assessment:#3F7D5C;
    --policy:#B8791F;
    --support:#6B4C8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#E4E6E5;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .deck{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .stage{
    container-type:inline-size;
    width:min(96vw, 170.6vh);
    aspect-ratio:16/9;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(15,18,22,0.35);
    border-radius:6px;
  }
  .slide{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    padding:6.2cqw 7cqw 5cqw;
  }
  .slide.active{display:flex;}

  .eyebrow{
    font-size:2cqw;
    letter-spacing:0.22em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:0.9cqw;
  }
  .eyebrow::before{
    content:"";
    display:inline-block;
    width:2.4cqw;
    height:0.35cqw;
    background:var(--accent);
  }
  .rule{
    margin-top:1.4cqw;
    height:1px;
    width:100%;
    background:var(--line);
  }

  h1.big-title{
    font-size:6.4cqw;
    font-weight:700;
    line-height:1.05;
    letter-spacing:-0.01em;
    margin-top:2.4cqw;
    max-width:90%;
  }
  h2.slide-title{
    font-size:4.6cqw;
    font-weight:700;
    line-height:1.08;
    letter-spacing:-0.01em;
    margin-top:1.6cqw;
    max-width:92%;
  }
  .subtitle{
    font-size:2.3cqw;
    color:var(--ink-soft);
    margin-top:1.6cqw;
    font-weight:400;
    max-width:75%;
  }
  .kicker-codes{
    margin-top:auto;
    display:flex;
    gap:2.4cqw;
    font-size:1.7cqw;
    color:var(--ink-soft);
    font-weight:600;
    letter-spacing:0.04em;
  }

  .body-area{
    margin-top:3cqw;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  ul.bullets{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:1.9cqw;
  }
  ul.bullets li{
    font-size:2.55cqw;
    line-height:1.35;
    padding-left:2.4cqw;
    position:relative;
    max-width:88%;
    font-weight:400;
  }
  ul.bullets li::before{
    content:"";
    position:absolute;
    left:0;
    top:0.65cqw;
    width:0.9cqw;
    height:0.9cqw;
    background:var(--accent);
    border-radius:50%;
  }
  ul.bullets li strong{font-weight:700;}
  ul.bullets.tight li{font-size:2.1cqw;}

  .statement{
    font-size:5.1cqw;
    font-weight:700;
    line-height:1.15;
    max-width:88%;
  }
  .statement .accent-word{color:var(--accent);}

  .grid-cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1.6cqw;
    margin-top:1cqw;
  }
  .grid-cards.cols-3{
    grid-template-columns:1fr 1fr 1fr;
  }
  .grid-cards.cols-3 .card{
    padding:1.5cqw 1.6cqw;
  }
  .grid-cards.cols-3 .card h3{
    font-size:1.75cqw;
    margin-bottom:0.7cqw;
  }
  .grid-cards.cols-3 .card p{
    font-size:1.5cqw;
    line-height:1.35;
    color:var(--ink-soft);
  }
  .card{
    border:1px solid var(--line);
    border-top:0.5cqw solid var(--card-color, var(--accent));
    padding:1.8cqw 2cqw;
    background:#fff;
  }
  .card h3{
    font-size:2cqw;
    font-weight:700;
    color:var(--card-color, var(--accent));
    margin-bottom:1cqw;
    letter-spacing:0.01em;
  }
  .card ul{list-style:none;display:flex;flex-direction:column;gap:0.55cqw;}
  .card li{font-size:1.68cqw;line-height:1.3;}

  .twocol{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4cqw;
    margin-top:1cqw;
  }
  .col h3{
    font-size:2.1cqw;
    font-weight:700;
    color:var(--accent);
    margin-bottom:1.3cqw;
    padding-bottom:0.8cqw;
    border-bottom:1px solid var(--line);
  }
  .col ul{list-style:none;display:flex;flex-direction:column;gap:1.1cqw;}
  .col li{font-size:2.05cqw;line-height:1.3;}

  .callout{
    margin-top:2cqw;
    border-left:0.45cqw solid var(--accent);
    background:rgba(0,0,0,0.02);
    padding:1.6cqw 2.2cqw;
    font-size:1.9cqw;
    line-height:1.4;
    color:var(--ink-soft);
    max-width:85%;
  }

  .bars{display:flex;flex-direction:column;gap:1.7cqw;margin-top:0.5cqw;}
  .bar-row{display:grid;grid-template-columns:32% 1fr 8%;align-items:center;gap:1.6cqw;}
  .bar-label{font-size:1.95cqw;font-weight:600;}
  .bar-track{height:1.6cqw;background:var(--line);position:relative;}
  .bar-fill{height:100%;background:var(--accent);}
  .bar-pct{font-size:1.95cqw;font-weight:700;text-align:right;color:var(--accent);}

  .table-simple{width:100%;border-collapse:collapse;margin-top:1cqw;}
  .table-simple th{
    text-align:left;font-size:1.7cqw;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;padding-bottom:1cqw;border-bottom:2px solid var(--ink);
  }
  .table-simple td{
    font-size:2.1cqw;padding:1.3cqw 0;border-bottom:1px solid var(--line);vertical-align:top;
  }

  /* section divider */
  .slide.divider{
    justify-content:center;
    align-items:flex-start;
    background:var(--accent);
    color:#fff;
  }
  .divider .eyebrow{color:rgba(255,255,255,0.75);}
  .divider .eyebrow::before{background:rgba(255,255,255,0.75);}
  .divider h1{
    font-size:7.2cqw;font-weight:700;color:#fff;margin-top:1.6cqw;line-height:1.02;
  }
  .divider .subtitle{color:rgba(255,255,255,0.8);}
  .divider .rule{background:rgba(255,255,255,0.25);}

  /* geometric accents */
  .motif{position:absolute;opacity:0.5;pointer-events:none;}
  .motif.corner-tr{top:5cqw;right:5cqw;}
  .motif.corner-br{bottom:5cqw;right:5cqw;}
  .divider .motif{opacity:0.35;}

  footer.chrome{
    position:absolute;
    left:0;right:0;bottom:0;
    display:flex;align-items:center;
    padding:0 7cqw 2.4cqw;
    gap:1.5cqw;
  }
  .progress-track{
    flex:1;height:2px;background:var(--line);position:relative;
  }
  .progress-fill{
    height:100%;background:var(--accent);width:0%;transition:width .25s ease;
  }
  .slide-count{
    font-size:1.5cqw;color:var(--ink-soft);font-weight:600;letter-spacing:0.03em;
    min-width:5cqw;text-align:right;
  }
  .divider footer.chrome .progress-track{background:rgba(255,255,255,0.25);}
  .divider footer.chrome .slide-count{color:rgba(255,255,255,0.8);}

  /* nav controls */
  .nav-btn{
    position:fixed;
    top:50%;transform:translateY(-50%);
    width:46px;height:46px;
    border-radius:50%;
    border:1px solid #C7CACD;
    background:rgba(255,255,255,0.9);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:20px;
    user-select:none;
    transition:background .15s ease, transform .15s ease;
    z-index:10;
  }
  .nav-btn:hover{background:#fff;transform:translateY(-50%) scale(1.06);}
  .nav-prev{left:22px;}
  .nav-next{right:22px;}
  .click-zone{
    position:absolute;top:0;bottom:0;width:12%;z-index:5;cursor:pointer;
  }
  .click-zone.left{left:0;}
  .click-zone.right{right:0;}

  @media (max-width:700px){
    .nav-btn{display:none;}
  }
</style>
</head>
<body>

<div class="deck">
  <div class="stage" id="stage">
    <div class="click-zone left" onclick="go(-1)"></div>
    <div class="click-zone right" onclick="go(1)"></div>
    <!-- slides injected here -->
  </div>
</div>

<div class="nav-btn nav-prev" onclick="go(-1)">&#8249;</div>
<div class="nav-btn nav-next" onclick="go(1)">&#8250;</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- ring motif -->
    <g id="motif-ring">
      <circle cx="60" cy="60" r="55" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </g>
    <!-- grid motif -->
    <g id="motif-grid">
      <circle cx="10" cy="10" r="4" fill="currentColor"/>
      <circle cx="35" cy="10" r="4" fill="currentColor"/>
      <circle cx="60" cy="10" r="4" fill="currentColor"/>
      <circle cx="10" cy="35" r="4" fill="currentColor"/>
      <circle cx="35" cy="35" r="4" fill="currentColor"/>
      <circle cx="60" cy="35" r="4" fill="currentColor"/>
      <circle cx="10" cy="60" r="4" fill="currentColor"/>
      <circle cx="35" cy="60" r="4" fill="currentColor"/>
      <circle cx="60" cy="60" r="4" fill="currentColor"/>
    </g>
    <!-- lines motif -->
    <g id="motif-lines">
      <line x1="0" y1="90" x2="90" y2="0" stroke="currentColor" stroke-width="2"/>
      <line x1="25" y1="110" x2="110" y2="25" stroke="currentColor" stroke-width="2"/>
      <line x1="50" y1="130" x2="130" y2="50" stroke="currentColor" stroke-width="2"/>
    </g>
    <!-- cluster motif -->
    <g id="motif-cluster">
      <circle cx="20" cy="20" r="6" fill="currentColor"/>
      <circle cx="60" cy="10" r="9" fill="currentColor"/>
      <circle cx="90" cy="45" r="5" fill="currentColor"/>
      <circle cx="45" cy="60" r="7" fill="currentColor"/>

    </g>
  </defs>
</svg>

let current = 0;
const stage = document.getElementById('stage');

function iconFor(color){
  return `<span style="color:${color}">&#9679;</span>`;
}

function renderBullets(li_items, cls=''){
  return `<ul class="bullets ${cls}">${li_items.map(t=>`<li>${t}</li>`).join('')}</ul>`;
}

function buildSlide(s, idx){
  const el = document.createElement('div');
  el.className = 'slide' + (s.type==='divider' ? ' divider' : '');
  el.style.setProperty('--accent', SECTION_COLOR[s.section]);

  const motifId = SECTION_MOTIF[s.section];
  const motifPos = (idx % 2 === 0) ? 'corner-tr' : 'corner-br';
  const motifHTML = `<svg class="motif ${motifPos}" width="9cqw" height="9cqw" viewBox="0 0 130 130" style="color:${SECTION_COLOR[s.section]}"><use href="#${motifId}"/></svg>`;

  let inner = '';

  if(s.type === 'title'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">CSCI-1100 / 1150</div>
      <h1 class="big-title">${s.title}</h1>
      <div class="subtitle">${s.subtitle}</div>
      <div class="kicker-codes">${s.codes.map(c=>`<span>${c}</span>`).join('<span>&mdash;</span>')}</div>
    `;
  }
  else if(s.type === 'statement'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">${s.eyebrow}</div>
      <div class="rule"></div>
      <div class="body-area">
        <div class="statement">${s.statement}</div>
        <div class="subtitle" style="margin-top:2.2cqw;">${s.sub}</div>
      </div>
    `;
  }
  else if(s.type === 'bullets'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="slide-title">${s.title}</h2>
      <div class="body-area">
        ${renderBullets(s.items)}
        ${s.tight ? renderBullets(s.tight,'tight') : ''}
        ${s.callout ? `<div class="callout">${s.callout}</div>` : ''}
      </div>
    `;
  }
  else if(s.type === 'grid'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="slide-title">${s.title}</h2>
      <div class="grid-cards">
        ${s.cards.map(c => `
          <div class="card" style="--card-color:${c.color}">
            <h3>${c.h}</h3>
            <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>`).join('')}
      </div>
    `;
  }
  else if(s.type === 'twocol'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="slide-title">${s.title}</h2>
      <div class="twocol">
        <div class="col"><h3>${s.colA.h}</h3><ul>${s.colA.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="col"><h3>${s.colB.h}</h3><ul>${s.colB.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
    `;
  }
  else if(s.type === 'grid6'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="slide-title">${s.title}</h2>
      <div class="grid-cards cols-3">
        ${s.cards.map(c => `
          <div class="card" style="--card-color:${SECTION_COLOR[s.section]}">
            <h3>${c.h}</h3>
            <p>${c.p}</p>
          </div>`).join('')}
      </div>
      ${s.note ? `<div class="callout" style="margin-top:1.6cqw;">${s.note}</div>` : ''}
    `;
  }
  else if(s.type === 'bars'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="slide-title">${s.title}</h2>
      <div class="bars">
        ${s.rows.map(r => `
          <div class="bar-row">
            <div class="bar-label">${r.label}<div style="font-size:1.5cqw;color:var(--ink-soft);font-weight:400;margin-top:0.3cqw;">${r.note}</div></div>
            <div class="bar-track"><div class="bar-fill" style="width:${r.pct*2}%"></div></div>
            <div class="bar-pct">${r.pct}%</div>
          </div>`).join('')}
      </div>
    `;
  }
  else if(s.type === 'divider'){
    inner = `
      ${motifHTML}
      <div class="eyebrow">Section</div>
      <h1>${s.title}</h1>
      <div class="subtitle">${SECTION_LABEL[s.section]}</div>
      <div class="rule"></div>
    `;
  }

  el.innerHTML = inner + `
    <footer class="chrome">
      <div class="progress-track"><div class="progress-fill" style="width:${((idx+1)/slides.length*100).toFixed(1)}%"></div></div>
      <div class="slide-count">${String(idx+1).padStart(2,'0')} / ${slides.length}</div>
    </footer>
  `;
  return el;
}

function render(){
  stage.querySelectorAll('.slide').forEach(n=>n.remove());
  slides.forEach((s,i) => {
    const el = buildSlide(s,i);
    if(i === current) el.classList.add('active');
    stage.appendChild(el);
  });
}

function go(dir){
  const next = current + dir;
  if(next < 0 || next >= slides.length) return;
  stage.querySelectorAll('.slide')[current].classList.remove('active');
  current = next;
  stage.querySelectorAll('.slide')[current].classList.add('active');
}

document.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(1); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  if(e.key === 'Home'){ current=0; render(); }
  if(e.key === 'End'){ current=slides.length-1; render(); }
});

render();
</script>
</body>
</html>
